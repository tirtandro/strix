name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'strix/**'
      - 'containers/Dockerfile.cloudrun'
      - 'containers/Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/deploy-gcp.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  JOB_NAME: strix-agent
  REPOSITORY: strix-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    # Opt into Node.js 24 to avoid deprecation warnings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: 'Docker Auth'
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |-
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.JOB_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" -f containers/Dockerfile.cloudrun .
          docker push "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # Deploy sebagai Cloud Run JOB (bukan Service)
      # Job tidak memerlukan HTTP server — cocok untuk CLI tool
      - name: Deploy to Cloud Run Job
        run: |-
          gcloud run jobs deploy ${{ env.JOB_NAME }} \
            --image "${{ env.IMAGE_TAG }}" \
            --region ${{ env.REGION }} \
            --memory 4Gi \
            --cpu 2 \
            --max-retries 0 \
            --task-timeout 3600 \
            --service-account "strix-deployer@strix-project-marshal.iam.gserviceaccount.com" \
            --set-env-vars "STRIX_RUNTIME_BACKEND=local,STRIX_SANDBOX_MODE=true,STRIX_LLM=gemini/gemma-3-27b,LLM_API_KEY=${{ secrets.GEMINI_API_KEY }}"
          
          echo "✅ Cloud Run Job deployed successfully!"
          echo "To run a scan, execute:"
          echo "gcloud run jobs execute ${{ env.JOB_NAME }} --region ${{ env.REGION }} --args='--target,https://example.com,--non-interactive'"
